<style>

@media (max-width:820px){
  #chron{width:auto;left:6px;top:auto;bottom:150px;max-height:32%}

<body>
<div id="app">
  <canvas id="cv"></canvas>
  <header id="hud" class="panel" style="display:none"></header>
  <aside id="chron" class="panel" style="display:none"><h3>Crónica</h3><div class="list"></div></aside>
  <div id="minibox" class="panel" style="display:none"><canvas id="mini" width="150" height="100"></canvas>
    <div id="zoom"><button data-a="zoomout" aria-label="Alejar">−</button><button data-a="center" aria-label="Centrar en ti">◎</button><button data-a="zoomin" aria-label="Acercar">+</button></div></div>
  <div id="ctx" class="panel" style="display:none"></div>
  <div id="bbar" class="panel" style="display:none"></div>
  <div id="pop" class="panel" style="display:none"></div>
  <div id="toasts"></div>
  <div id="modal"><div class="box panel"></div></div>
</div>
<script>
'use strict';
// ================= Constantes y utilidades =================
const W=150,H=100,TS=8,DAY=1.0,SPEEDS=[1,2,4];
const WATER=0,SAND=1,GRASS=2,FOREST=3,HILL=4,MOUNT=5;
const SPEEDF=[0.5,0.9,1,0.65,0.7,0.5];
const SAVEKEY='estandarte_v03';
const R=()=>Math.random();
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

const KNAMES=['Valdoria','Castemar','Aldervik','Morvenn','Brenmoor','Ostrava','Lindemar','Tharsis'];
const KCOLORS=['#3b6fb6','#b33a3a','#3f8a4a','#8a55b0','#c8742a'];
const PCOLOR='#e2b93b', BCOLOR='#4a3b30';
const HOUSES=['Aranda','Montfort','Lusignan','Haro','Lara','Castro','Ventadour','Blois','Ibelín','Anjou','Moncada','Trastámara'];
const MALE=['Aldric','Bertrán','Conrado','Godofredo','Leopoldo','Ramiro','Tancredo','Ulrico','Wilfredo','Fernando','Alfonso','Sancho','Rodrigo','Balduino','Teobaldo','Gonzalo','Hugo','Raimundo','Lope','Íñigo','Martín','Pedro','Tomás','Bernardo','Guillén','Nuño','Diego','Esteban','Mateo','Simón','Garcí','Vela','Ordoño','Fruela'];
const FEMALE=['Leonor','Urraca','Matilde','Berenguela','Isabel','Constanza','Blanca','Sancha','Elvira','Teresa','Jimena','Inés'];
const EPI=['el Cojo','el Rojo','Manodura','el Joven','el Tuerto','el Callado','Barbanegra','el Zurdo','el Viejo','Cuervo','el Herrero','el Largo','Medioañal','el Pardo'];
const PRE=['Val','Mon','Roc','Fuen','Ser','Bel','Cas','Tor','Al','Mira','Pe','Bur','Cor','Vi','Sa','Gra','Os','Bre'];
const SUF=['dosa','real','ferrada','tejo','nera','lagos','viejo','mora','bria','cedo','randa','gal','fría','monte','vado','sella','gosa','mar'];
const SEASONS=['primavera','verano','otoño','invierno'];
const STRAITS={
  'Valiente':{d:'No se arredra: +1 ataque',atk:1},
  'Cobarde':{d:'Pierde el valor pronto: −1 ataque',atk:-1},
  'Fuerte':{d:'+8 de vida',hp:8},
  'Ágil':{d:'Se mueve y golpea más rápido',spd:.35,cd:-.15},
  'Torpe':{d:'Golpea más lento',cd:.2},
  'Glotón':{d:'Come el doble',food:1},
  'Leal':{d:'Nunca deserta'},
  'Veterano':{d:'Curtido en mil peleas: +1 defensa',def:1},
};
const LTRAITS={'Carismático':'Reclutar te cuesta menos','Guerrero':'Más vida y ataque en combate','Astuto':'La comida te cuesta menos','Ambicioso':'Ganas más renombre'};
const RTRAITS=['Belicoso','Pacífico','Ambicioso','Prudente','Cruel','Justo'];

let G=null, started=false, terr, hgt, comp, mainComp=0, own;
let terrCv, terrCtx2, miniBase;
let NID=1; const nid=()=>NID++;
let road=new Uint8Array(W*H);
function fmtDate(d){return `Día ${d%15+1} de ${SEASONS[Math.floor(d/15)%4]}, año ${1200+Math.floor(d/60)}`}

// ================= Terreno =================
function genTerrain(seed){
  const r=mulberry32(seed);
  function mk(cells){const n=cells+1,L=new Float32Array(n*n);for(let i=0;i<L.length;i++)L[i]=r();
    return(x,y)=>{const fx=x*cells,fy=y*cells,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
      const a=L[iy*n+ix],b=L[iy*n+ix+1],c=L[(iy+1)*n+ix],d=L[(iy+1)*n+ix+1];return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}}
  const oct=[[mk(3),.5],[mk(7),.25],[mk(14),.14],[mk(28),.08]], moi=[[mk(4),.6],[mk(11),.3],[mk(24),.1]];
  terr=new Uint8Array(W*H); hgt=new Float32Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const u=x/W,v=y/H; let h=0; for(const[f,w]of oct)h+=f(u,v)*w; h/=.97;
    let m=0; for(const[f,w]of moi)m+=f(u,v)*w;
    const dx=(u-.5)*2,dy=(v-.5)*2, d=Math.max(Math.abs(dx),Math.abs(dy))*.55+Math.hypot(dx,dy)*.45;
    h=h-d*d*.62+.2; const i=y*W+x; hgt[i]=h;
    terr[i]= h<.37?WATER: h<.40?SAND: h>.80?MOUNT: h>.70?HILL: m>.54?FOREST: GRASS;
  }
  // componentes conexas de tierra transitable
  comp=new Int32Array(W*H).fill(-1); let best=0,bestN=0,c=0; const st=[];
  for(let i=0;i<W*H;i++){ if(comp[i]>=0||!passIdx(i))continue; let n=0; st.push(i); comp[i]=c;
    while(st.length){const j=st.pop();n++;const x=j%W,y=(j/W)|0;
      for(const[k,ok]of[[j-1,x>0],[j+1,x<W-1],[j-W,y>0],[j+W,y<H-1]])if(ok&&comp[k]<0&&passIdx(k)){comp[k]=c;st.push(k)}}
    if(n>bestN){bestN=n;best=c} c++; }
  mainComp=best; return bestN;
}
function passIdx(i){const t=terr[i];return t!==WATER&&t!==MOUNT}
function inMain(x,y){x|=0;y|=0;return x>=0&&y>=0&&x<W&&y<H&&comp[y*W+x]===mainComp}
function passableAt(x,y){return inMain(x,y)}
function terrAt(x,y){return terr[clamp(y|0,0,H-1)*W+clamp(x|0,0,W-1)]}
function lineClear(ax,ay,bx,by){const d=dist(ax,ay,bx,by),n=Math.ceil(d*2);for(let i=1;i<=n;i++){const t=i/n;if(!passableAt(ax+(bx-ax)*t,ay+(by-ay)*t))return false}return true}

// A* en rejilla de 8 direcciones
const gS=new Float32Array(W*H),came=new Int32Array(W*H),stamp=new Int32Array(W*H),closedS=new Int32Array(W*H);let stampN=0;
function nearestPass(x,y){x=clamp(x|0,0,W-1);y=clamp(y|0,0,H-1);if(inMain(x,y))return[x,y];
  for(let r=1;r<8;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const a=x+dx,b=y+dy;if(inMain(a,b))return[a,b]}return null}
function findPath(fx,fy,tx,ty){
  const s=nearestPass(fx,fy),t=nearestPass(tx,ty); if(!s||!t)return null;
  const S=s[1]*W+s[0],T=t[1]*W+t[0]; if(S===T)return[[tx,ty]];
  stampN++; const hx=[],hf=[];
  const push=(n,f)=>{hx.push(n);hf.push(f);let i=hx.length-1;while(i>0){const p=(i-1)>>1;if(hf[p]<=hf[i])break;[hx[p],hx[i]]=[hx[i],hx[p]];[hf[p],hf[i]]=[hf[i],hf[p]];i=p}};
  const pop=()=>{const top=hx[0],ln=hx.pop(),lf=hf.pop();if(hx.length){hx[0]=ln;hf[0]=lf;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<hx.length&&hf[l]<hf[m])m=l;if(r<hx.length&&hf[r]<hf[m])m=r;if(m===i)break;[hx[m],hx[i]]=[hx[i],hx[m]];[hf[m],hf[i]]=[hf[i],hf[m]];i=m}}return top};
  const heur=(i)=>{const dx=Math.abs(i%W-t[0]),dy=Math.abs(((i/W)|0)-t[1]);return (dx+dy-.6*Math.min(dx,dy))*.95};
  stamp[S]=stampN;gS[S]=0;came[S]=-1;push(S,heur(S)); let it=0,found=false;
  while(hx.length&&it++<14000){const c=pop();if(closedS[c]===stampN)continue;closedS[c]=stampN;if(c===T){found=true;break}
    const cx=c%W,cy=(c/W)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(!inMain(nx,ny))continue;
      if(dx&&dy&&(!inMain(cx+dx,cy)||!inMain(cx,cy+dy)))continue;
      const n=ny*W+nx;if(closedS[n]===stampN)continue;const cost=(dx&&dy?1.414:1)/SPEEDF[terr[n]]/(road[n]?1.6:1);const g=gS[c]+cost;
      if(stamp[n]!==stampN||g<gS[n]){stamp[n]=stampN;gS[n]=g;came[n]=c;push(n,g+heur(n))}}}
  if(!found)return null; const path=[]; let c=T; while(c!==S&&c>=0){path.push([c%W+.5,((c/W)|0)+.5]);c=came[c]}
  path.reverse(); if(path.length)path[path.length-1]=[inMain(tx,ty)?tx:t[0]+.5,inMain(tx,ty)?ty:t[1]+.5]; return path;
}

// ================= Mundo =================
function newName(){const used=new Set(G.settlements.map(s=>s.name));for(let i=0;i<50;i++){const n=pick(PRE)+pick(SUF);if(!used.has(n))return n}return pick(PRE)+pick(SUF)+' '+ri(2,9)}
function makeRuler(k){const female=R()<.25,name=female?pick(FEMALE):pick(MALE);k.names[name]=(k.names[name]||0)+1;
  const tr=[pick(RTRAITS)];let t2=pick(RTRAITS);if(t2!==tr[0]&&!((t2==='Belicoso'&&tr[0]==='Pacífico')||(t2==='Pacífico'&&tr[0]==='Belicoso')||(t2==='Cruel'&&tr[0]==='Justo')||(t2==='Justo'&&tr[0]==='Cruel')))tr.push(t2);
  return{name,female,num:k.names[name],age:ri(22,60),traits:tr}}
function rulerTitle(k){const r=k.ruler;return `${r.female?'Reina':'Rey'} ${r.name} ${ROMAN[r.num]||r.num}`}
function makeSoldier(lvl=1,q=1,eq=0){
  const s={eq:0,id:nid(),name:pick(MALE)+(R()<.55?' '+pick(EPI):''),lvl:1,xp:0,kills:0,traits:[],hp:0,maxhp:Math.round(28*q),atk:Math.round(6*q),def:0,spd:1.7,cdb:1.1};
  const keys=Object.keys(STRAITS),n=R()<.35?2:1,bad={Valiente:'Cobarde',Cobarde:'Valiente','Ágil':'Torpe',Torpe:'Ágil'};
  let g=0;while(s.traits.length<n&&g++<20){const t=pick(keys);if(!s.traits.includes(t)&&!s.traits.includes(bad[t]))s.traits.push(t)}
  for(const t of s.traits){const e=STRAITS[t];if(e.atk)s.atk+=e.atk;if(e.hp)s.maxhp+=e.hp;if(e.spd)s.spd+=e.spd;if(e.cd)s.cdb+=e.cd;if(e.def)s.def+=e.def}
  for(let i=1;i<lvl;i++)lvlUp(s); if(eq)setEq(s,eq); s.hp=s.maxhp; return s;
}
function lvlUp(s){s.lvl++;s.maxhp+=4;s.atk+=1;s.hp=Math.min(s.maxhp,s.hp+4)}
// Árbol de tropas: Recluta → Soldado → (Guardia | Hachero) → Sargento/veterano → Élite
const UPXP=[0,0,40,90,160,260],UPCOST=[0,0,20,45,90,160];
function rankName(s){if(s.lord)return'Señor';const r=s.lvl,g=s.line!=='h';return r<=1?'Recluta':r===2?'Soldado':r===3?(g?'Guardia':'Hachero'):r===4?(g?'Sargento de guardia':'Hachero veterano'):(g?'Guardia de élite':'Campeón')}
function canUp(s){return!s.lord&&s.lvl<5&&s.xp>=UPXP[s.lvl+1]}
function doUp(s,line){const need=UPXP[s.lvl+1];if(s.lvl===2)s.line=line||'g';s.xp-=need;lvlUp(s);if(s.line==='g'&&(s.lvl===3||s.lvl===5)){s.def+=1;s.maxhp+=4}if(s.line==='h'&&s.lvl>=3)s.atk+=1;
  const minEq=s.lvl>=5?3:s.lvl>=3?2:1;if((s.eq||0)<minEq)setEq(s,minEq);s.hp=Math.min(s.maxhp,s.hp+6)}

    r+=(R()-.5)*.8;const ca=settl(a.capital),cb=settl(b.capital);if(ca&&cb&&dist(ca.x,ca.y,cb.x,cb.y)<60)r-=.12;
    for(const x of[a,b]){if(x.ruler.traits.includes('Belicoso'))r-=.1;if(x.ruler.traits.includes('Pacífico'))r+=.08}
    G.rel[kk]=clamp(r,-100,100);const wc=x=>ks.filter(y=>y!==x&&atWarDirect(x.id,y.id)).length;
    if(!atWarDirect(a.id,b.id)){if(r<-45&&R()<.03&&wc(a)<2&&wc(b)<2){const[x,y]=R()<.5?[a.id,b.id]:[b.id,a.id];declareWar(x,y)}}
    else{const len=G.day-G.wars[kk];if(len>40&&R()<.02+(len>100?.02:0))makePeace(a.id,b.id)}}
  for(const k of ks){const kk=key(0,k.id),r=G.rel[kk]??0;G.rel[kk]=clamp(r+(r<0?.06:-.02),-100,100);
    if(!atWarDirect(0,k.id)&&G.player.liege!==k.id&&r<-55&&R()<.03&&G.player.renown>=5)declareWar(k.id,0)}
  // bandidos
  if(G.parties.filter(p=>p.kind==='bandit').length<6&&R()<.14){const pp=PP();
    for(let t=0;t<40;t++){const x=ri(2,W-3),y=ri(2,H-3),tt=terr[y*W+x];if((tt!==FOREST&&tt!==HILL)||!inMain(x,y)||!farFromSettl(x,y,9)||dist(x,y,pp.x,pp.y)<12)continue;
      const b={id:nid(),kind:'bandit',fac:-1,x:x+.5,y:y+.5,soldiers:[],path:[],target:null,immune:0,face:1,name:'Bandidos'};const n=ri(3,7);
      for(let i=0;i<n;i++)b.soldiers.push(makeSoldier(R()<.2?2:1,.82,R()<.2?1:0));G.parties.push(b);break}}
  for(const p of G.parties)if(p.kind!=='player'&&!p.inBattle)for(const s of p.soldiers){s.hp=Math.min(s.maxhp,s.hp+3);if(s.wounded&&s.hp>=s.maxhp*.6)s.wounded=false}

}
function spawnArmy(k,mine){const c=settl(k.capital)||mine[0],n=Math.min(Math.floor(k.man),8+mine.length*2,30);k.man-=n;

// ================= Paso de simulación =================
function update(dt){
  G.dayT+=dt;while(G.dayT>=DAY){G.dayT-=DAY;daily()}
  updateParties(dt);
  for(const B of [...battles])updateBattle(B,dt);
  for(const c of corpses)c.t+=dt;corpses=corpses.filter(c=>c.t<30);
  for(const f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0);
}
function step(dt){const n=Math.ceil(dt/.05),s=dt/n;for(let i=0;i<n;i++)update(s)}

function saveGame(quiet){try{if(battles.length){if(!quiet)toast('No puedes guardar en mitad de una batalla.');return}
  const data=JSON.stringify({v:3,NID,G:{...G,parties:G.parties.map(p=>({...p,path:[],inBattle:null}))}});localStorage.setItem(SAVEKEY,data);if(!quiet)toast('Partida guardada.')}catch(e){if(!quiet)toast('No se pudo guardar en este navegador.')}}
function hasSave(){try{return!!localStorage.getItem(SAVEKEY)}catch(e){return false}}
function loadGame(){try{const d=JSON.parse(localStorage.getItem(SAVEKEY));if(!d||d.v!==3)return false;genTerrain(d.G.seed);G=d.G;NID=d.NID;battles=[];corpses=[];fx=[];G.enc=null;road=new Uint8Array(W*H);for(const r of G.roads||[])for(const[x,y]of r)road[(y|0)*W+(x|0)]=1;
  for(const p of G.parties){p.path=[];p.inBattle=null;if(p.kind!=='garrison'&&p.kind!=='player')p.target=null;if(p.kind==='player'){p.inside=null;p.target=null}}
  own=null;buildTerrainCanvas();rebuildTerritory();return true}catch(e){return false}}

// ================= Economía, equipo y rangos =================
const GOODS={grano:{n:'Grano',p:10,r:2},pescado:{n:'Pescado',p:12,r:2},ganado:{n:'Ganado',p:32,r:6},madera:{n:'Madera',p:14},hierro:{n:'Hierro',p:34},lana:{n:'Lana',p:22},vino:{n:'Vino',p:40},sal:{n:'Sal',p:26}};
const GK=Object.keys(GOODS),FOODK=['grano','pescado','ganado'];
const PROD={grano:'campos de trigo',pescado:'pescadores',ganado:'ganadería',madera:'leñadores y carpinteros',hierro:'mina de hierro',lana:'pastores de ovejas',vino:'viñedos',sal:'salinas'};
const EQ=[{n:'Harapos',atk:0,def:0,hp:0,c:0},{n:'Gambesón y lanza',atk:2,def:1,hp:4,c:35},{n:'Cota de malla',atk:3,def:2,hp:8,c:90},{n:'Armadura de placas',atk:5,def:4,hp:12,c:220}];
const TIERS=[{r:0,n:'Caballero errante',m:12},{r:20,n:'Señor menor',m:20},{r:50,n:'Capitán',m:32},{r:100,n:'Barón',m:48},{r:200,n:'Conde',m:70},{r:400,n:'Duque',m:100}];
const RAID_MIN=15,TAKE_VILLAGE_MIN=10,CASTLE_MIN=30,CASTLE_WOOD=8;
function tierOf(){let t=0;for(let i=0;i<TIERS.length;i++)if(G.player.renown>=TIERS[i].r)t=i;return t}
function partyLimit(){return TIERS[tierOf()].m+lordOf().lvl}
function menOf(){return PP().soldiers.length-1}
function capacity(){return 30+12*PP().soldiers.length}
function invLoad(){let n=0;for(const k of GK)n+=G.player.inv[k]||0;return n}
function setEq(s,t){const a=EQ[s.eq||0],b=EQ[t];s.atk+=b.atk-a.atk;s.def+=b.def-a.def;s.maxhp+=b.hp-a.hp;s.hp=clamp(s.hp+Math.max(0,b.hp-a.hp),1,s.maxhp);s.eq=t}
function rations(){const pl=G.player;let r=pl.rac||0;for(const k of FOODK)r+=(pl.inv[k]||0)*GOODS[k].r;return r}
function eatNeed(){return PP().soldiers.reduce((a,s)=>a+(s.traits.includes('Glotón')?2:1),0)}
function pickProduct(x,y){let w=0,m=0,f=0,sd=0;for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const t=terrAt(x+dx,y+dy);if(t===WATER)w++;else if(t===MOUNT||t===HILL)m++;else if(t===FOREST)f++;else if(t===SAND)sd++}
  if(w>14&&R()<.75)return'pescado';if(m>8&&R()<.8)return'hierro';if(f>14&&R()<.8)return'madera';if(sd>6&&R()<.4)return'sal';
  const q=R();return q<.38?'grano':q<.62?'ganado':q<.8?'lana':q<.93?'vino':'madera'}
function initStock(s){s.stock={};if(s.type==='castle'){for(const k of GK)s.stock[k]=ri(6,18)}else{s.prod=pickProduct(s.x,s.y);s.stock[s.prod]=ri(12,24);if(s.prod!=='grano')s.stock.grano=ri(3,8);
  if(s.prod==='pescado'){let b=null;for(let r=1;r<6&&!b;r++)for(let a=0;a<12&&!b;a++){const x=Math.round(s.x+Math.cos(a/12*6.283)*r),y=Math.round(s.y+Math.sin(a/12*6.283)*r);if(terrAt(x,y)===WATER)b=[x+.5,y+.5]}s.boat=b}}
  s.raided=0}
function price(s,k){const g=GOODS[k],st=s.stock[k]||0;
  if(s.type==='village'){if(k===s.prod)return Math.max(2,Math.round(g.p*clamp(1.15-st/45,.45,1.15)));return Math.max(2,Math.round(g.p*clamp(1.35-st/30,.8,1.5)))}
  return Math.max(2,Math.round(g.p*clamp(1.6-st/25,.6,1.8)))}
const buyP=(s,k)=>Math.ceil(price(s,k)*(G.player.traits.includes('Astuto')?1:1.1)),sellP=(s,k)=>Math.floor(price(s,k)*.9);
function nearestCastleOf(s){let b=null,bd=1e9;for(const c of G.settlements){if(c.type!=='castle')continue;const d=dist(s.x,s.y,c.x,c.y)*(c.owner===s.owner?1:2.5);if(d<bd){bd=d;b=c}}return b}
function econDaily(){
  for(const s of G.settlements){if(!s.stock)initStock(s);
    if(s.type==='village'){if(s.raided>0){s.raided--;continue}
      s.stock[s.prod]=Math.min(60,(s.stock[s.prod]||0)+ri(2,4));if(s.prod!=='grano'&&R()<.4)s.stock.grano=Math.min(20,(s.stock.grano||0)+1);
      for(const k of GK)if(k!==s.prod&&k!=='grano'&&(s.stock[k]||0)>0&&R()<.3)s.stock[k]--;
      if((s.stock[s.prod]||0)>12){const c=nearestCastleOf(s);if(c){s.stock[s.prod]-=2;c.stock[s.prod]=(c.stock[s.prod]||0)+2}}}
    else for(const k of GK){const v=s.stock[k]||0;if(v>0&&R()<.55)s.stock[k]=v-1}}}
// prisioneros
function addPrisoners(n,val){const pl=G.player;pl.pris=pl.pris||{n:0,v:0};pl.pris.n+=n;pl.pris.v+=n*val}

function questText(q){if(q.type==='bandits'){const b=party(q.target);return`Acabar con ${b?partyName(b).toLowerCase()+' ('+b.soldiers.length+' hombres)':'unos bandidos'} cerca de ${settl(q.giver)?.name||'—'}`}
  return`Llevar ${q.qty} de ${GOODS[q.good].n} a ${settl(q.giver)?.name||'—'}`}
function makeOffers(s){if(s.offerDay!=null&&G.day-s.offerDay<10&&s.offers)return s.offers;s.offerDay=G.day;s.offers=[];

  let b=null,bd=28;for(const p of G.parties){if(p.kind!=='bandit'||p.inBattle)continue;const d=dist(p.x,p.y,s.x,s.y);if(d<bd){bd=d;b=p}}
  if(!b){for(let t=0;t<60&&!b;t++){const a=R()*6.283,r=8+R()*8,x=s.x+Math.cos(a)*r,y=s.y+Math.sin(a)*r;if(!inMain(x,y)||!farFromSettl(x,y,4))continue;
    b={id:nid(),kind:'bandit',fac:-1,x,y,soldiers:[],path:[],target:null,immune:0,face:1,name:'Bandidos'};const n=s.type==='castle'?ri(6,10):ri(4,7);for(let i=0;i<n;i++)b.soldiers.push(makeSoldier(R()<.3?2:1,.85));G.parties.push(b)}}
  if(b)s.offers.push({type:'bandits',target:b.id,reward:40+b.soldiers.length*(s.type==='castle'?16:11),ren:s.type==='castle'?4:2});
  if(s.type==='castle'){const want=[...GK].sort((a,c)=>(s.stock[a]||0)-(s.stock[c]||0)).slice(0,3),k=pick(want),qty=ri(5,10);

  else{const k=pick(GK.filter(x=>x!==s.prod)),qty=ri(4,8);s.offers.push({type:'deliver',good:k,qty,reward:Math.round(qty*GOODS[k].p*1.6),ren:2})}

function questsDaily(){const pl=G.player;pl.quests=(pl.quests||[]).filter(q=>{

  if(G.day>q.dl){log(`Se venció el plazo de tu tarea: ${questText(q)}.`,true);const s=settl(q.giver);if(s&&s.owner>0)addRel(0,s.owner,-3);return false}return true})}
function completeQuest(q){const pl=G.player;pl.quests=pl.quests.filter(x=>x!==q);pl.gold+=q.reward;pl.renown+=q.ren;const s=settl(q.giver);if(s&&s.owner>0)addRel(0,s.owner,6);

function power(list){let s=0;for(const x of list){if(x.hp<=0||x.wounded)continue;s+=(x.atk+x.def*1.2)*(Math.max(1,x.hp)+x.def*5)}return s}
function winChance(me,foe){const a=Math.pow(power(me.soldiers)*(.8+baseMorale(me)/250),2.4),b=Math.pow(power(foe.soldiers)*(.8+baseMorale(foe)/250),2.4);return a/(a+b||1)}
function avgEq(list){if(!list.length)return 0;return Math.round(list.reduce((a,s)=>a+(s.eq||0),0)/list.length)}
function openEncounter(o,s,mode){if(G.enc)return;const p=PP();const mine=!!(p.target&&((p.target.type==='party'&&p.target.id===o.id)||(s&&p.target.type==='settlement')));

  else{t=partyName(o);d=e.mine?`Alcanzas a ${partyName(o).toLowerCase()}: ${o.soldiers.length} hombres.`:`${partyName(o)} (${o.soldiers.length} hombres) se lanza contra ti.`}

function autoResolve(B){let i=0;while(battles.includes(B)&&i++<5000)updateBattle(B,.08)}
function encAct(v){const e=G.enc,o=party(e.id),p=PP();G.enc=null;closeModal();if(!o)return;const s=e.siege?settl(e.siege):null;
  if(v==='flee'){if(s||e.mine){p.target=null;p.immune=3;return}
    const ch=clamp(.85-p.soldiers.length/(o.soldiers.length*2+2),.15,.85);
    if(R()<ch){p.immune=6;toast('Lograste escapar.');let lost=0;for(const k of GK){const n=Math.floor((G.player.inv[k]||0)*.2);G.player.inv[k]-=n;lost+=n}if(lost)log(`Al huir abandonaste ${lost} cargas de mercancía.`);return}

function drawRoad(pts){const c=terrCv.getContext('2d');for(const pass of[0,1])for(let i=1;i<pts.length;i++){const[x0,y0]=pts[i-1],[x1,y1]=pts[i],n=Math.ceil(dist(x0,y0,x1,y1)*TS);

function act(a,v){const pl=G&&G.player,p=G&&PP();
  switch(a){
  case'start':{pl.name=($('nm').value||'Sir Aldric').trim().slice(0,28);const lt=Object.keys(LTRAITS).sort(()=>R()-.5);pl.traits=[lt[0],lt[1]];
    if(pl.traits.includes('Guerrero')){const L=lordOf();L.maxhp+=20;L.hp=L.maxhp;L.atk+=3}
    G.kingdoms[0].name=facName(0);pl.started=true;closeModal();beginPlay();log(`${pl.name} parte en busca de fortuna con tres hombres.`);break}
  case'continue':if(loadGame()){closeModal();beginPlay();toast('Partida cargada.')}else toast('No se pudo cargar la partida.');break;
  case'newworld':genWorld((Math.random()*2**31)>>>0);buildTerrainCanvas();rebuildTerritory();cam.x=PP().x;cam.y=PP().y;break;
  case'pause':paused=!paused;break;
  case'speed':speedIdx=+v;paused=false;break;
  case'company':companyModal();break;case'kingdoms':kingdomsModal();break;
  case'chron':$('chron').classList.toggle('hide');break;case'save':saveGame(false);break;case'close':if(p&&p.inside){townView='main';townModal()}else closeModal();break;case'popclose':popClose();break;
  case'zoomin':cam.zoom=Math.min(6,cam.zoom+1);break;case'zoomout':cam.zoom=Math.max(1,cam.zoom-1);break;case'center':cam.follow=true;break;
  case'cmd':{const B=battles.find(b=>sideOfPlayer(b)>=0);if(B){B.cmd=v;if(v==='retreat')B.rt=0}break}
  case'recruit':{const s=settl(p.inside)||pNear,cost=pl.traits.includes('Carismático')?18:25;let n=+v||1,got=0;while(n-->0&&s&&s.recruits>0&&pl.gold>=cost&&menOf()<partyLimit()){pl.gold-=cost;s.recruits--;p.soldiers.push(makeSoldier(1));got++}if(got)toast(`${got} ${got>1?'voluntarios se unen':'voluntario se une'} a tu compañía.`);if(p.inside)townModal();break}
  case'enter':{const s=settl(+v);if(!s||facWar(0,s.owner))break;popClose();if(dist(p.x,p.y,s.x,s.y)<2.2)enterSettlement(s);else{p.target={type:'enter',id:s.id};setPathTo(p,s.x,s.y+1);cam.follow=true}break}
  case'leave':leaveSettlement();break;
  case'tv':townView=v;townModal();break;
  case'buy':{const s=settl(p.inside),[k,n0]=v.split('|');let n=+n0;while(n-->0&&(s.stock[k]||0)>0&&pl.gold>=buyP(s,k)&&invLoad()<capacity()){pl.gold-=buyP(s,k);s.stock[k]--;pl.inv[k]=(pl.inv[k]||0)+1}townModal();break}
  case'sell':{const s=settl(p.inside),[k,n0]=v.split('|');let n=+n0;while(n-->0&&(pl.inv[k]||0)>0){pl.gold+=sellP(s,k);s.stock[k]=(s.stock[k]||0)+1;pl.inv[k]--}townModal();break}
  case'equip':{const[t0,useI]=v.split('|'),t=+t0,need=p.soldiers.filter(x=>(x.eq||0)<t);let cost=need.reduce((a,x)=>a+EQ[t].c-EQ[x.eq||0].c,0);
    if(+useI){cost=Math.round(cost*.75);if((pl.inv.hierro||0)<need.length)break;pl.inv.hierro-=need.length}if(pl.gold<cost)break;pl.gold-=cost;for(const x of need)setEq(x,t);log(`Equipaste a ${need.length} hombres con ${EQ[t].n.toLowerCase()}.`);townModal();break}
  case'hire':{const s=settl(p.inside),m=s&&s.mercs&&s.mercs[+v];if(m&&pl.gold>=m.cost&&menOf()<partyLimit()){pl.gold-=m.cost;s.mercs.splice(+v,1);delete m.cost;p.soldiers.push(m);toast(`${m.name} se une por dinero.`)}townModal();break}
  case'sellpris':{if(pl.pris&&pl.pris.n){log(`Vendiste ${pl.pris.n} prisioneros por ${pl.pris.v} de oro.`,true);pl.gold+=pl.pris.v;pl.pris={n:0,v:0}}townModal();break}
  case'accept':{const s=settl(p.inside),o=s.offers[+v];if(o&&(pl.quests||[]).length<3){pl.quests.push({...o,giver:s.id,dl:G.day+30});toast('Tarea aceptada.')}townModal();break}
  case'deliver':{const q=pl.quests[+v];if(q&&(pl.inv[q.good]||0)>=q.qty){pl.inv[q.good]-=q.qty;const s=settl(q.giver);s.stock[q.good]=(s.stock[q.good]||0)+q.qty;completeQuest(q)}townModal();break}
  case'work':{const s=settl(p.inside),gold=2*p.soldiers.length*2;for(let i=0;i<2;i++)step(DAY);pl.gold+=gold;log(`Tus hombres trabajaron dos días en ${s.name}: +${gold} oro.`,true);townModal();break}
  case'rest':{for(let i=0;i<3;i++)step(DAY);toast('Descansaste tres días.');if(p.inside)townModal();break}
  case'enc':encAct(v);break;
  case'grantcastle':grantCastle();break;
  case'up':{const[i,line]=v.split('|'),s=p.soldiers[+i];if(s&&canUp(s)&&pl.gold>=UPCOST[s.lvl+1]){pl.gold-=UPCOST[s.lvl+1];doUp(s,line);toast(`${s.name} asciende a ${rankName(s)}.`)}companyModal();break}
  case'upall':{let n=0;for(const s of p.soldiers){if(canUp(s)&&s.lvl!==2&&pl.gold>=UPCOST[s.lvl+1]){pl.gold-=UPCOST[s.lvl+1];doUp(s);n++}}if(n)toast(`${n} hombres ascendieron.`);companyModal();break}
  case'quests':questsModal();break;
  case'occupy':closeModal();G.sack=null;break;
  case'sack':{const s=settl(G.sack);G.sack=null;closeModal();if(!s)break;const gold=ri(160,320);pl.gold+=gold;let got=0;for(const k of GK){const n=Math.min(s.stock[k]||0,Math.max(0,capacity()-invLoad()));pl.inv[k]=(pl.inv[k]||0)+n;s.stock[k]-=n;got+=n}
    const prev=s.prevOwner!=null&&s.prevOwner>0&&G.kingdoms[s.prevOwner].alive?s.prevOwner:null;if(prev){s.owner=prev;party(s.gar).fac=prev;addRel(0,prev,-25);rebuildTerritory()}
    log(`Saqueaste ${s.name}: +${gold} oro y ${got} cargas de botín.${prev?' Lo dejas vacío para '+G.kingdoms[prev].name+'.':''}`,true);break}
  case'gleave':{const s=settl(p.inside)||pNear;if(s&&s.owner===0&&p.soldiers.length>1){const i=p.soldiers.findIndex(x=>!x.lord);party(s.gar).soldiers.push(p.soldiers.splice(i,1)[0])}if(p.inside)townModal();break}
  case'gtake':{const s=settl(p.inside)||pNear;if(s&&s.owner===0&&menOf()<partyLimit()){const g=party(s.gar);if(g.soldiers.length)p.soldiers.push(g.soldiers.pop())}if(p.inside)townModal();break}
  case'swear':{const k=G.kingdoms[+v];if(canSwear(k)){pl.liege=k.id;addRel(0,k.id,20);log(`Juraste lealtad a ${rulerTitle(k)} de ${k.name}. Sus enemigos ahora son los tuyos.`,true);if(p.inside)townModal();else if(modalOpen)kingdomsModal()}break}
  case'break':{const k=G.kingdoms[pl.liege];pl.liege=null;addRel(0,k.id,-40);log(`Rompiste tu juramento con ${k.name}. No lo olvidarán.`,true);if(modalOpen)kingdomsModal();break}
  case'war':{declareWar(0,+v);if(modalOpen)kingdomsModal();break}
  case'peace':{const k=G.kingdoms[+v],r=getRel(0,k.id),ch=clamp(.3+pl.renown*.006+(r+100)/500,.1,.85);
    if(R()<ch)makePeace(0,k.id);else{pl.peaceCD=10;addRel(0,k.id,-5);log(`${rulerTitle(k)} rechazó tu propuesta de paz.`,true)}if(modalOpen)kingdomsModal();break}
  case'attack':{const q=party(+v);if(!q)break;if(q.fac>0&&!facWar(0,q.fac)){if(pl.liege===q.fac)act('break');declareWar(0,q.fac,'atacaste a sus hombres')}
    p.target={type:'party',id:q.id};p.think=0;popClose();break}
  case'siege':{const[sid,mode]=v.split('|'),s=settl(+sid);if(!s)break;const men=menOf();
    if(mode==='raid'&&men<RAID_MIN){toast(`Para saquear necesitas al menos ${RAID_MIN} hombres.`);break}
    if(mode!=='raid'&&s.type==='village'&&men<TAKE_VILLAGE_MIN){toast(`Para tomar una aldea necesitas al menos ${TAKE_VILLAGE_MIN} hombres.`);break}
    if(s.type==='castle'&&(men<CASTLE_MIN||(pl.inv.madera||0)<CASTLE_WOOD)){toast(`Para asaltar un castillo necesitas ${CASTLE_MIN} hombres y ${CASTLE_WOOD} de madera para las escalas.`);break}
    if(s.owner>0&&!facWar(0,s.owner)){if(pl.liege===s.owner)act('break');declareWar(0,s.owner,(mode==='raid'?'saqueaste ':'atacaste ')+s.name)}
    p.target={type:'settlement',id:s.id,mode};setPathTo(p,s.x,s.y);popClose();cam.follow=true;break}
  case'goto':{const s=settl(+v);if(s){p.target={type:'point',x:s.x,y:s.y+1};setPathTo(p,s.x,s.y+1)}popClose();break}
  }uiTick()}

function clickMap(sx,sy){const r=cv.getBoundingClientRect(),tx=cam.x+(sx-r.left-cssW/2)/(TS*cam.zoom),ty=cam.y+(sy-r.top-cssH/2)/(TS*cam.zoom);
  const p=PP();if(p.inBattle||p.inside||G.enc)return;
  let best=null,bd=1.1;for(const q of G.parties){if(q.kind==='garrison'||q.kind==='player'||q.inBattle)continue;const d=dist(q.x,q.y-.8,tx,ty);if(d<bd){bd=d;best=q}}
  if(best){pop={type:'party',id:best.id};return}
  let bs=null,bsd=9;for(const s of G.settlements){const d=dist(s.x,s.y-(s.type==='castle'?2:1),tx,ty);if(d<(s.type==='castle'?2.6:2.1)&&d<bsd){bsd=d;bs=s}}
  if(bs){pop={type:'settlement',id:bs.id};return}
  popClose();if(!inMain(tx,ty))return;p.target={type:'point',x:tx,y:ty};setPathTo(p,tx,ty);cam.follow=true}
const KM={KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Enter'&&!started)act('start');return}
  if(modalOpen)return;
  if(KM[e.code]){keys[KM[e.code]]=true;cam.follow=true;e.preventDefault()}
  else if(e.code==='Space'){paused=!paused;e.preventDefault()}else if(e.key==='1'||e.key==='2'||e.key==='3'){speedIdx=+e.key-1;paused=false}
  else if(e.key==='+'||e.key==='=')act('zoomin');else if(e.key==='-')act('zoomout');else if(e.key==='Escape'){if(G&&(G.enc||G.sack||PP().inside))return;if(modalOpen&&started)closeModal();else popClose()}});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
addEventListener('resize',resize);

// ================= Arranque =================
function beginPlay(){started=true;for(const id of['hud','minibox'])$(id).style.display='';$('chron').style.display='';if(innerWidth<820)$('chron').classList.add('hide');
  const p=PP();cam.x=p.x;cam.y=p.y;cam.follow=true;chronDirty=true;miniDirty=true}
let last=performance.now(),uiT=0;
function frame(t){const dtr=Math.min(.05,(t-last)/1000);last=t;now=t/1000;
  if(G&&started){const sp=paused||modalOpen?0:SPEEDS[speedIdx];if(sp>0)step(dtr*sp);
    const p=PP();if(cam.follow){const B=battles.find(b=>sideOfPlayer(b)>=0),tx=B?B.cx:p.x,ty=B?B.cy:p.y;cam.x+=(tx-cam.x)*Math.min(1,dtr*6);cam.y+=(ty-cam.y)*Math.min(1,dtr*6)}
    uiT-=dtr;if(uiT<=0){uiT=.25;uiTick()}miniT-=dtr;if(miniT<=0){miniT=.4;renderMini()}}
  else if(G){const p=PP();cam.x+=Math.sin(t/4000)*.01}
  render();requestAnimationFrame(frame)}
resize();genWorld((Math.random()*2**31)>>>0);buildTerrainCanvas();rebuildTerritory();{const p=PP();cam.x=p.x;cam.y=p.y;cam.zoom=2}
startModal();requestAnimationFrame(frame);
</script>
